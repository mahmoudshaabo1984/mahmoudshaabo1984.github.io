<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Mahmoud Shaabo</title>
    <meta name="description" content="The page you were looking for could not be found. Return to the Mahmoud Shaabo portfolio home.">
    <meta name="robots" content="noindex, follow">
    <meta id="theme-color-meta" name="theme-color" content="#0d1117">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=2.1">

    <script>
        (function () {
            function normalizeTheme(value) {
                return value === 'light' ? 'light' : 'dark';
            }
            function applyTheme(theme) {
                theme = normalizeTheme(theme);
                var html = document.documentElement;
                html.setAttribute('data-theme', theme);
                html.classList.toggle('theme-light', theme === 'light');
                html.classList.toggle('theme-dark', theme === 'dark');
                html.style.colorScheme = theme;
                var meta = document.getElementById('theme-color-meta');
                if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f8fa' : '#0d1117');
            }
            try {
                var stored = localStorage.getItem('theme');
                var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                applyTheme(stored || (prefersLight ? 'light' : 'dark'));
            } catch (e) { /* ignore */ }
        })();
    </script>

    <style>
        .nf-wrap {
            min-height: calc(100vh - 76px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .nf-code {
            font-family: var(--font-en);
            font-size: clamp(6rem, 18vw, 12rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
        .nf-title {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 800;
            margin-bottom: 14px;
        }
        .nf-text {
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto 32px;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
