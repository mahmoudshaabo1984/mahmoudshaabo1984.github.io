# Netlify deployment configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
    publish = "."

# ---------------------------------------------------------------
# Security & best-practice headers (applied to every response)
# ---------------------------------------------------------------
[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options             = "SAMEORIGIN"
        X-Content-Type-Options      = "nosniff"
        Referrer-Policy             = "strict-origin-when-cross-origin"
        Permissions-Policy          = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        X-XSS-Protection            = "1; mode=block"
        Strict-Transport-Security   = "max-age=31536000; includeSubDomains; preload"
        Content-Security-Policy     = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# ---------------------------------------------------------------
# HTML: always revalidate (prevents stale HTML with old asset refs)
# ---------------------------------------------------------------
[[headers]]
    for = "/*.html"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
    for = "/"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------
# Long-term caching for static assets (use ?v= query for busting)
# ---------------------------------------------------------------
[[headers]]
    for = "*.css"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "*.js"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "*.jpg"
    [headers.values]
        Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
    for = "*.png"
    [headers.values]
        Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
    for = "*.svg"
    [headers.values]
        Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
    for = "*.ico"
    [headers.values]
        Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
    for = "*.webmanifest"
    [headers.values]
        Cache-Control = "public, max-age=604800"
        Content-Type  = "application/manifest+json"

[[headers]]
    for = "/sitemap.xml"
    [headers.values]
        Cache-Control = "public, max-age=86400"
        Content-Type  = "application/xml; charset=utf-8"

[[headers]]
    for = "/robots.txt"
    [headers.values]
        Cache-Control = "public, max-age=86400"
        Content-Type  = "text/plain; charset=utf-8"

# ---------------------------------------------------------------
# Pretty 404 (Netlify serves /404.html automatically for misses)
# ---------------------------------------------------------------
[[redirects]]
    from = "/index.html"
    to   = "/"
    status = 301
    force = true
